name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart-logic:
    name: Dart pure-logic verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # This used to be dart-lang/setup-dart with the comment "the verify_*
      # scripts have no package: imports, so they run without pub get". That
      # stopped being true: verify_datemath and verify_reminder_schedule import
      # package:timezone, verify_transport imports package:http (and so does
      # lib/data/http_transport.dart, which it pulls in). A clean checkout has
      # no .dart_tool/, and `dart run` does NOT resolve dependencies for you —
      # it only skips resolution for scripts that need no package. Those three
      # would have died with "Not found: 'package:timezone/timezone.dart'" and
      # exit 254, i.e. zero assertions, reported by verify_all as ERROR.
      #
      # And pub get here needs Flutter, not bare Dart: pubspec.yaml depends on
      # `flutter: sdk: flutter`, which a standalone Dart SDK cannot resolve at
      # all. So the job takes the Flutter SDK even though nothing it runs is a
      # Flutter program.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: app
      # verify_all discovers every runner, so adding one needs no CI change.
      # It exits 1 if ANY runner fails or fails to compile — a runner that
      # cannot compile prints no summary line and is reported as ERROR rather
      # than skipped, which is the only reason four silently-dead runners were
      # findable at all.
      - name: Verify all pure-Dart domain logic
        run: dart run tool/verify_all.dart
        working-directory: app

  flutter-tests:
    name: Flutter widget + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # The job has always been named "typecheck + tests" but only ran the
      # tests, so type errors reached main unnoticed — including a push payload
      # that could not have worked.
      - run: npm run typecheck
      - run: npm test

  dependencies:
    name: Dependency advisories (high + critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No install: `npm audit` reads package-lock.json, and both workspaces
      # are in the one at the root.
      #
      # Not `npm audit --audit-level=high` directly. That is red today and would
      # be red every day after — the tree already carries eight advisories at
      # high or above, and the fix for the two worst is a major upgrade of
      # fastify and of vitest. A build that is always red is one nobody reads.
      # tools/audit-deps.mjs fails on anything at high or critical that is not
      # named, dated and justified in its ACCEPTED list, so a NEW one stops the
      # build the day it appears and an old one cannot be forgotten.
      - name: npm advisories
        run: node tools/audit-deps.mjs

  python-dependencies:
    name: Python advisories (cry classifier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pip-audit
      # Its own job, so a finding here reads as a finding rather than as the
      # smoke tests breaking.
      #
      # pip-audit has no severity threshold — PyPI advisories frequently carry
      # no CVSS at all — so unlike the npm gate this one fails on ANY advisory.
      # That is tolerable because requirements.txt is nine pinned packages with
      # no dev tools in it, and because of what they do: librosa and soundfile
      # parse an audio file a caller uploaded to /cry/analyze.
      #
      # If it goes red on something with no fix available, the response is
      # `--ignore-vuln <ID>` on this line with a dated comment saying why —
      # never deleting the step.
      - name: pip advisories
        run: pip-audit -r packages/cry-classifier/requirements.txt

  cry-classifier:
    name: Cry classifier (smoke tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # ffmpeg/libsndfile for pydub + soundfile, same as the Docker image.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - run: pip install -r requirements.txt pytest
        working-directory: packages/cry-classifier
      # Smoke tests only — no dataset or trained model needed. They pin the
      # feature-extraction invariants (fixed vector length, determinism) that the
      # train/serve contract depends on.
      - run: pytest -q
        working-directory: packages/cry-classifier
