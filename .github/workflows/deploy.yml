# Ship main to ana-bala.kz.
#
# WHY THIS EXISTS
#
# Deploying was two commands somebody had to remember, from a machine that
# happened to hold the right SSH key: `git push`, then
# `ssh root@… 'bash /opt/umay/deploy/update.sh'`. In practice the second half
# got skipped, and the live panel drifted a long way behind main — a whole set
# of finished, tested, committed frames sat in the repository and nobody could
# use them, which is the same "built and not wired" failure this project keeps
# producing, one level up.
#
# Now the push IS the deploy. No laptop, no session, no key on anybody's
# machine.
#
# ONE-TIME SETUP (two things, both on GitHub/the server, neither in this repo):
#
#   1. Put the deploy key's PRIVATE half in the repo secret ANABALA_SSH_KEY:
#        Settings → Secrets and variables → Actions → New repository secret
#        Name: ANABALA_SSH_KEY     Value: contents of ~/.ssh/anabala_deploy
#
#   2. Put its PUBLIC half on the server, once, from a machine that can log in:
#        ssh-copy-id -i ~/.ssh/anabala_deploy.pub root@188.137.231.252
#
# Until both are done this workflow fails loudly at the connect step and says
# so, rather than reporting a green deploy that never happened.

name: Deploy

on:
  push:
    branches: [main]
  # So a deploy can be re-run from the GitHub UI without a commit — the button
  # somebody needs when a deploy half-failed and the fix is to run it again.
  workflow_dispatch:

# One deploy at a time. Two overlapping runs would have the box pulling and
# recreating its container simultaneously.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: ship main to ana-bala.kz
    runs-on: ubuntu-latest
    # Nothing ships unless the suites are green. Deploying past a red test is
    # how a broken panel reaches an operator who is mid-shift.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Deliberately identical to the `backend` job in ci.yml — root directory,
      # root scripts. Keep the two in step: a deploy gate that diverges from CI
      # is a gate that goes green on a different repository than the one CI
      # checked, and the difference is invisible until it matters.
      #
      # This used to run `npm ci && npx tsc --noEmit -p tsconfig.json &&
      # npx vitest run` with `working-directory: packages/backend`. That is not
      # broken the way it looks — npm walks up to the workspace lock, and vitest
      # walks up to the root vitest.config.ts, so both the install and the 30 s
      # panel-suite timeout were fine (verified on npm 10.9.2 and 11.16.0,
      # vitest 2). What it did do is silently scope the gate to ONE package:
      #
      #   * vitest's root became packages/backend, and its include glob is
      #     relative to root — so packages/shared/src/__tests__/contract.test.ts
      #     and triage.test.ts were never collected. `npx vitest run
      #     contract.test` from there prints "No test files found". contract is
      #     the app<->backend payload contract; it is not an optional suite.
      #   * `-p tsconfig.json` typechecks packages/backend only, while
      #     `npm run typecheck` is `tsc -b packages/shared packages/backend`.
      #     A type error in shared could not fail this deploy.
      #
      # So "nothing ships unless the suites are green" was true of the backend
      # suites and untrue of the shared ones. Running from the root fixes both.
      - name: Typecheck + tests (whole workspace)
        run: |
          npm install
          npm run typecheck
          npm test

      - name: Load the deploy key
        env:
          KEY: ${{ secrets.ANABALA_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::ANABALA_SSH_KEY is not set — see the setup note at the top of this file."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/anabala_deploy
          chmod 600 ~/.ssh/anabala_deploy
          # Pinned by scan on first use. The alternative — StrictHostKeyChecking=no
          # — accepts whatever answers on that address.
          ssh-keyscan -H 188.137.231.252 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: |
          # update.sh does the rest: git pull, migrations, container recreate,
          # then it VERIFIES the served /admin actually contains each feature's
          # marker. It exits non-zero when a check fails, so a stale container
          # cannot pass as a successful deploy.
          ssh -i ~/.ssh/anabala_deploy \
              -o BatchMode=yes -o ConnectTimeout=20 \
              root@188.137.231.252 \
              'bash /opt/umay/deploy/update.sh'

      - name: Verify the live site
        run: |
          # Not a single curl. deploy/verify-live.sh asks the internet the same
          # questions a phone and a browser ask — every public route, the panel
          # markers that prove the container restarted with the new file, and
          # that nothing untrue is on the page. It exits non-zero if any of that
          # is wrong, so a deploy cannot report success while the site is broken.
          bash deploy/verify-live.sh
