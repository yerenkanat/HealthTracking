# Local Postgres for the backend.
#
# The schema is now plain PostgreSQL (see the portability note in db/schema.sql) —
# it needs only standard contrib extensions (uuid-ossp, pg_trgm, citext), all of
# which ship with the official postgres image. No TimescaleDB / PostGIS, so any
# managed Postgres works for hosting too.
#
# Port 5433 on the host, deliberately: a stock Postgres install already listens on
# 5432, and this must not fight it.
#
#   docker compose up -d
#   DATABASE_URL=postgres://umay:umay@127.0.0.1:5433/umay npm run db:apply
#   DATABASE_URL=postgres://umay:umay@127.0.0.1:5433/umay npm run dev
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: umay
      POSTGRES_PASSWORD: umay
      POSTGRES_DB: umay
    ports:
      - "5433:5432"
    volumes:
      - umay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umay -d umay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  umay_pgdata:
