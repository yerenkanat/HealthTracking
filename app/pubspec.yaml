name: fcs_app
description: FemTech & Child Safety — Flutter app (pregnancy health + child safety).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"           # Color.withValues used in the emergency screen

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:          # ru / kk / en Material+Cupertino localizations
    sdk: flutter
  intl: any
  flutter_blue_plus: ^1.32.0      # BLE band + beacon
  geolocator: ^12.0.0            # GPS/location fixes
  sensors_plus: ^6.0.0          # accelerometer → AdaptiveScanController
  connectivity_plus: ^6.0.0     # flush batcher on reconnect
  flutter_local_notifications: ^17.2.3   # on-device alerts (geofence enter/exit)
  timezone: ^0.9.4              # tz-aware scheduling for reminder notifications
  # firebase_messaging: ^15.0.0   # FCM/APNS push
  url_launcher: ^6.3.0          # tel: dialer for the emergency call button
  http: ^1.2.0                  # backend API transport
  google_maps_flutter: ^2.9.0   # child tracking map + geofence overlays
  shared_preferences: ^2.3.0    # persist onboarding/session config
  image_picker: ^1.1.0          # pick profile / child photos from gallery or camera
  audioplayers: ^6.1.0          # daily calendar audio playback
  path_provider: ^2.1.0         # app documents dir to store picked photos
  flutter_timezone: ^5.1.0
  video_player: ^2.13.0
  share_plus: ^13.2.1
  # Screen 10: the contraction timer must keep the screen on. A phone that
  # sleeps mid-labour loses the interval she is timing, and she is not in a
  # position to keep tapping it awake.
  wakelock_plus: ^1.7.0
  record: ^6.0.0                # short mic recording for cry analysis (6.x: the
  youtube_player_iframe: ^6.0.2
                               # linux/platform-interface impls are version-
                               # consistent; 5.x shipped a stale record_linux
                               # that broke the Android build compiling a Linux
                               # impl it never runs)
  # mmkv: ^2.0.0                  # fast disk mirror for offline-first batcher

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Already pulled in by audioplayers; declared so a widget test may replace
  # AudioplayersPlatformInterface.instance with a fake — the seam the plugin
  # provides for driving a player with no device behind it. Without this,
  # DailyAudioCard can never reach its «ready» state in `flutter test` and the
  # full player it opens is untestable.
  audioplayers_platform_interface: ^7.2.0

flutter:
  uses-material-design: true
  assets:
    # Authored timeline content. Edit this file to publish real lessons and
    # products; the app falls back to the seeded catalogue if it is absent.
    - assets/content/catalog.json
    # Week-by-week pregnancy calendar (ru + kk). A copy of the shared contract
    # packages/contract/pregnancy_weeks.json; kept in sync by
    # tool/verify_pregnancy_weeks_contract.dart.
    - assets/data/pregnancy_weeks.json
    # Week-by-week baby-development calendar (ru + kk). A copy of the shared
    # contract packages/contract/baby_development.json; kept in sync by
    # tool/verify_baby_development_contract.dart.
    - assets/data/baby_development.json
    # Screen 37 «Экстренная помощь» — the red/amber scenarios and what to do
    # about each. A copy of the shared contract
    # packages/contract/emergency_help.json; kept in sync by
    # tool/verify_emergency_help_contract.dart. Bundled rather than fetched
    # because the one moment this screen is opened is the one moment a phone
    # may have no signal.
    - assets/data/emergency_help.json
  # Fonts for the Ana-Bala design system (docs/design-system-app.md).
  #
  # Unbounded, Manrope and Rubik are VARIABLE fonts — one file carrying the whole
  # weight axis. Declaring one `weight:` per family is correct for them: Flutter
  # picks the file, and the actual weight comes from `fontVariations` in the text
  # style (see ui/design_system.dart). Listing several fake weights against the
  # same file would just invite synthetic bolding.
  #
  # Cyrillic coverage was read from each font's cmap table, and it is why the
  # Kazakh interface uses Rubik throughout:
  #   Unbounded      — Russian ✓, Kazakh ✗ (no Ә Ғ Қ Ң Ө Ұ Ү Һ)
  #   Manrope        — Russian ✓, Kazakh ✗ (no Ә Ғ Қ Ң Ұ)
  #   JetBrainsMono  — Russian ✓, Kazakh ✗ (no Ә Ғ Қ Ң Ұ Һ)
  #   Rubik          — Russian ✓, Kazakh ✓   ← the fallback for all of the above
  fonts:
    # Display: screen titles and hero metrics on Russian screens.
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded.ttf
    # UI and body copy.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    # Every Kazakh screen, and the glyph fallback for every family above — a
    # Kazakh name inside the Russian UI would otherwise render as empty boxes.
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    # (Outfit, the previous theme's face, is gone. It carried no Cyrillic at all
    # — 360 glyphs, Latin only — so every Russian string it was applied to was
    # silently rendering in a system fallback font.)
